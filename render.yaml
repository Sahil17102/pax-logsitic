services:
  - type: web
    name: paxlogistic
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://pax-logistic.onrender.com
      - key: VITE_APP_MODE
        value: client
      - key: VITE_ENABLE_PREVIEW_MODE
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: pax-logsiticadmin-utus
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://pax-logistic.onrender.com
      - key: VITE_APP_MODE
        value: admin
      - key: VITE_ENABLE_PREVIEW_MODE
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: pax-logistic
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DATABASE
        value: false
      - key: OTP_DELIVERY_MODE
        value: onscreen
      - key: FRONTEND_URLS
        value: https://paxlogistic.onrender.com,https://pax-logsiticadmin-utus.onrender.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SHA256
        value: d3471dde926ef8d5d96a61f5fe9e43627b5fb1b433ddd39f4b03739f3a7485cd
      - key: JWT_SECRET
        generateValue: true
      - key: DELHIVERY_ENV
        value: production
      - key: DELHIVERY_API_TOKEN
        sync: false
      - key: DELHIVERY_PICKUP_LOCATION
        sync: false
      - key: DELHIVERY_CLIENT_NAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pax-logistic-db
          property: connectionString

databases:
  - name: pax-logistic-db
    databaseName: pax_logistics
    user: pax_logistics
