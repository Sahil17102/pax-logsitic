services:
  - type: web
    name: paxlogistic
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://pax-logistic.onrender.com
      - key: VITE_APP_MODE
        value: client
      - key: VITE_ENABLE_PREVIEW_MODE
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: pax-logsiticadmin-utus
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://pax-logistic.onrender.com
      - key: VITE_APP_MODE
        value: admin
      - key: VITE_ENABLE_PREVIEW_MODE
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: pax-logistic
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DATABASE
        value: true
      - key: FRONTEND_URLS
        value: https://paxlogistic.onrender.com,https://pax-logsiticadmin-utus.onrender.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pax-logistic-db
          property: connectionString

databases:
  - name: pax-logistic-db
    databaseName: pax_logistics
    user: pax_logistics
