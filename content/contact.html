<!doctype html>
<html lang="en">
  <body>
    <main id="main">
      <section class="page-hero">
        <div class="shell narrow">
          <p class="eyebrow">Contact</p>
          <h1>Talk to a local shipping desk.</h1>
          <p class="lead">Call, email or visit us in Himayat Nagar. We will help you plan the next step.</p>
        </div>
      </section>

      <section class="section page-section">
        <div class="shell contact-layout">
          <div class="contact-list">
            <a href="tel:+919494338206"><small>Phone</small><strong>+91 94943 38206</strong><span>→</span></a>
            <a href="mailto:Saipratham650@gmail.com"><small>Email</small><strong>Saipratham650@gmail.com</strong><span>→</span></a>
            <a href="https://maps.google.com/?q=House+Number+3-6-105+Flat+Number+105+Himayat+Nagar+Hyderabad+Telangana+500029" target="_blank" rel="noreferrer"><small>Address</small><strong>House No. 3-6-105, Flat No. 105,<br />Himayat Nagar, Hyderabad, Telangana 500029</strong><span>↗</span></a>
          </div>
          <form class="form-card contact-form" id="contact-form">
            <p class="mini-label">Shipment enquiry</p>
            <h2>Send the basic details.</h2>
            <label>Your name<input id="contact-name" required placeholder="Name" /></label>
            <label>Phone number<input id="contact-phone" inputmode="tel" required placeholder="+91" /></label>
            <label>What do you need to send?<textarea id="contact-message" rows="4" required placeholder="Route, parcel and preferred date"></textarea></label>
            <p class="form-error" id="contact-error" role="alert"></p>
            <button class="button button-dark full-button" type="submit">Continue on WhatsApp <span>→</span></button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
